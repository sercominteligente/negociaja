<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D47A1"><title>Avaliar experiência • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><style>.feedback-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#f8fbff,#eef4ff)}.feedback-card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.feedback-card h1{margin:8px 0}.stars{display:flex;gap:8px;margin:18px 0}.stars button{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:26px;cursor:pointer}.stars button.on{background:#fff7d6;border-color:#ffc107}.feedback-card textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:vertical}.feedback-status{min-height:24px;margin-top:12px;color:var(--muted)}.feedback-brand{display:flex;align-items:center;min-height:54px}.feedback-brand img{max-width:220px;max-height:70px;object-fit:contain}</style></head><body class="landing"><main class="feedback-page"><section class="feedback-card"><a class="feedback-brand" href="/"><img id="platformLogo" alt="NegocIAJá!" hidden><span id="platformFallback" class="brand-word">Negoc<span>IA</span><b>Já!</b></span></a><span class="kicker">Pós-venda</span><h1 id="feedbackTitle">Como foi sua experiência?</h1><p id="feedbackCopy">Sua avaliação ajuda a empresa a melhorar atendimento, produto e operação.</p><form id="feedbackForm"><input type="hidden" id="rating" value=""><div class="stars" id="stars" aria-label="Nota de 1 a 5"><button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button></div><label>Comentário
