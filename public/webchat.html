<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atendimento • NegocIAJá!</title><style>:root{--p:#169cff;--s:#0b2b7c}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#14213d}.chat-shell{min-height:100vh;display:grid;place-items:center;padding:16px}.chat-card{width:min(760px,100%);height:min(760px,calc(100vh - 32px));background:white;border-radius:22px;box-shadow:0 18px 60px #0b2b7c22;display:flex;flex-direction:column;overflow:hidden}.chat-head{padding:18px 20px;background:linear-gradient(135deg,var(--s),var(--p));color:white;display:flex;gap:14px;align-items:center}.chat-head img{width:52px;height:52px;object-fit:contain;background:white;border-radius:12px;padding:5px}.chat-head h1{font-size:20px;margin:0}.chat-head p{margin:4px 0 0;opacity:.9}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#f8fafc}.msg{max-width:78%;padding:11px 14px;border-radius:16px;background:white;border:1px solid #e5eaf2;white-space:pre-wrap}.msg.me{align-self:flex-end;background:var(--p);color:white;border-color:transparent}.start{padding:30px;display:grid;gap:12px}.start input,.composer input{width:100%;border:1px solid #d8dfeb;border-radius:12px;padding:13px;font:inherit}.start button,.composer button{border:0;border-radius:12px;padding:13px 18px;background:var(--p);color:white;font-weight:700;cursor:pointer}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e7ebf2}.composer[hidden]{display:none}.powered{text-align:center;padding:7px;font-size:11px;color:#7c879b}.status{font-size:13px;color:#6d7788}</style></head><body><main class="chat-shell"><section class="chat-card"><header class="chat-head"><img id="brandLogo" hidden alt="Logo"><div><h1 id="brandName">Atendimento</h1><p id="brandHeadline">Como podemos ajudar?</p></div></header><section class="start" id="startPanel"><p id="brandMessage">Fale com nosso atendimento inteligente.</p><label>Seu nome<input id="visitorName" maxlength="120" placeholder="Como podemos chamar você?"></label><button id="startBtn">Iniciar conversa</button><div class="status" id="startStatus"></div></section><section class="messages" id="messages" hidden></section><form class="composer" id="composer" hidden><input id="textInput" maxlength="4000" autocomplete="off" placeholder="Digite sua mensagem…"><button>Enviar</button></form><footer class="powered" id="powered">Powered by NegocIAJá!</footer></section></main><script src="/webchat.js"></script></body></html>
