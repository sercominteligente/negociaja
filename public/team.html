<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Equipe e Integrações • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;background:#f4f7fb;color:#071a43;font-family:Inter,system-ui,Arial,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:#fff;border-bottom:1px solid #dfe7f3;position:sticky;top:0}.top a{color:#0b2b7c;font-weight:800;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#fff;border:1px solid #dfe7f3;border-radius:18px;padding:20px}.card h2{margin:0 0 6px}.muted{color:#667085}.member,.diag{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e5ebf4;border-radius:13px;padding:12px;margin-top:10px}.member small,.diag small{display:block;color:#667085;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}button,select,input{font:inherit}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;background:#eaf3ff;color:#0b2b7c}.btn.primary{background:#1269e8;color:#fff}.btn.warn{background:#fff4e6;color:#9a5b00}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.form label{display:grid;gap:5px;font-weight:700;font-size:13px}.form input,.form select{padding:10px;border:1px solid #ced9e8;border-radius:9px}.form .full{grid-column:1/-1}.readiness{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.ready{padding:10px;border-radius:10px;background:#f6f8fc;border:1px solid #e5ebf4}.ready.ok{background:#effcf4;border-color:#c8efd7}.ready b{display:block}.toast{position:fixed;right:20px;bottom:20px;background:#071a43;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wrap{padding:16px}.top{padding:14px}}</style></head><body><header class="top"><div><a href="/app">← Voltar ao painel</a><strong style="margin-left:18px">Equipe & Integrações</strong></div><a href="/company-settings.html">Minha Empresa</a></header><main class="wrap"><div class="grid"><section class="card"><h2>Equipe e permissões</h2><p class="muted">Administre quem pode operar esta empresa. O proprietário permanece protegido.</p><form id="memberForm" class="form"><label>Nome<input name="name" required maxlength="160"></label><label>E-mail<input name="email" type="email" required maxlength="180"></label><label>Perfil<select name="role"><option value="operator">Operador</option><option value="manager">Gerente</option><option value="admin">Administrador</option><option value="viewer">Somente leitura</option></select></label><div style="align-self:end"><button class="btn primary" type="submit">Adicionar usuário</button></div></form><div id="members"></div></section><section class="card"><h2>Prontidão da operação</h2><p class="muted">Visão objetiva do que já existe e do que ainda falta configurar.</p><div id="readiness" class="readiness"></div><button id="runHealth" class="btn primary" style="margin-top:14px">Executar diagnóstico</button><h3 style="margin-top:22px">Últimos checks</h3><div id="health"></div></section></div></main><div class="toast" id="toast"></div><script src="/team.js"></script></body></html>
