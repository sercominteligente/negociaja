<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loja • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><style>:root{--shop:#169cff;--shop2:#0b2b7c}.shop{max-width:1100px;margin:auto;padding:18px 16px 90px}.shop-head{display:flex;justify-content:space-between;gap:16px;align-items:center;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:10;padding:10px 0}.shop-logo{max-height:56px;max-width:190px}.shop-hero{padding:36px 0 20px}.shop-hero h1{font-size:clamp(34px,6vw,58px);margin:8px 0;color:var(--shop2)}.shop-search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:20px 0}.shop-search input{height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px}.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px}.product strong{font-size:18px}.product .price{font-size:22px;font-weight:900;color:var(--shop2)}.cart-drawer{position:fixed;right:14px;bottom:14px;width:min(390px,calc(100% - 28px));max-height:72vh;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;z-index:20;overflow:auto}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.cart-row input{width:70px}.orders{margin-top:34px}.order-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;display:grid;gap:8px}.shop .btn.primary{background:linear-gradient(135deg,var(--shop2),var(--shop))}@media(max-width:760px){.shop-grid{grid-template-columns:1fr 1fr}.shop-head{align-items:flex-start}.shop-logo{max-width:150px}}@media(max-width:480px){.shop-grid{grid-template-columns:1fr}}</style></head><body class="landing"><main class="shop"><header class="shop-head"><div><img id="shopLogo" class="shop-logo" hidden alt="Logo"><div class="brand-word" id="shopName">Carregando…</div></div><button class="btn primary" id="cartBtn">Carrinho <span id="cartCount">0</span></button></header><section class="shop-hero"><span class="kicker">NEGOCIE, COMPRE, REPITA</span><h1 id="shopHeadline">Seu catálogo em um único lugar.</h1><p id="shopMessage"></p><div class="shop-search"><input id="searchInput" placeholder="Buscar produto ou serviço"><button class="btn soft" id="searchBtn">Buscar</button></div></section><section class="shop-grid" id="catalog"></section><section class="orders"><span class="kicker">SUA JORNADA</span><h2>Meus pedidos nesta sessão</h2><div id="orders"></div></section></main><aside class="cart-drawer" id="cart" hidden><div class="panel-head"><h2>Carrinho</h2><button class="touch soft-button" id="closeCart">×</button></div><div id="cartItems"></div><p><strong>Total: <span id="cartTotal">R$ 0,00</span></strong></p><form id="checkoutForm"><label>Seu nome<input name="customer_name" required></label><label>WhatsApp<input name="customer_phone" required placeholder="5585999999999"></label><label>Como prefere receber?<select name="fulfillment_type"><option value="pickup">Retirada / combinar</option><option value="delivery">Entrega</option><option value="service">Execução do serviço</option></select></label><label>Observações<textarea name="notes" rows="3"></textarea></label><button class="btn primary large" type="submit">Finalizar pedido</button></form><div id="shopStatus"></div></aside><script src="/storefront.js"></script></body></html>
