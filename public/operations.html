<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Central Operacional • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/app.css"><style>body{background:#f3f6fb;color:#101828;font-family:system-ui,sans-serif;margin:0}.oc{max-width:1280px;margin:auto;padding:24px}.oc-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.oc-head h1{margin:4px 0;color:#071a43}.page-brand{display:flex;gap:14px;align-items:center}.page-brand>img{width:165px;max-height:64px;object-fit:contain}.oc-tabs{display:flex;gap:8px;flex-wrap:wrap}.oc-tabs button{border:1px solid #dce5f2;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.oc-tabs button.active{background:#0b2b7c;color:#fff}.oc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric,.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:15px}.metric span,.muted{color:#667085}.metric strong{display:block;font-size:22px;color:#071a43}.panel{display:none}.panel.active{display:block}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #edf1f6;padding:11px 0}.row:last-child{border:0}.row>div{min-width:0}.row strong{display:block}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn2{border:0;border-radius:9px;padding:8px 10px;background:#eaf3ff;color:#0b2b7c;font-weight:800;cursor:pointer}.btn2.primary{background:#0b2b7c;color:#fff}.tag{padding:4px 7px;border-radius:99px;background:#eef3fb;font-size:11px;font-weight:800}.formline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.formline input,.formline select{border:1px solid #d6deeb;border-radius:9px;padding:8px}.toast{position:fixed;right:18px;bottom:70px;background:#071a43;color:#fff;padding:11px 14px;border-radius:10px;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(max-width:800px){.oc-grid{grid-template-columns:1fr 1fr}.oc-head{align-items:flex-start;flex-direction:column}.page-brand{align-items:flex-start;flex-direction:column}.page-brand>img{width:145px}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}@media(max-width:480px){.oc-grid{grid-template-columns:1fr}.oc{padding:14px}}</style></head><body><main class="oc"><header class="oc-head"><div class="page-brand"><img src="https://negociaja.com.br/brand/logo-primary.png" alt="NegocIAJá!"><div><small class="muted">NEGOCIAJÁ • OPERAÇÃO</small><h1>Central Operacional</h1><p class="muted">Pedidos, estoque e recebimentos conectados ao mesmo fluxo.</p></div></div><div class="oc-tabs"><button class="active" data-tab="orders">Pedidos</button><button data-tab="inventory">Estoque</button><button data-tab="finance">Financeiro</button><a class="btn2" href="/app">← Painel</a></div></header><section class="oc-grid" id="metrics"></section><section class="panel active card" data-panel="orders"><h2>Pedidos</h2><div id="orders"></div></section><section class="panel card" data-panel="inventory"><h2>Estoque</h2><div id="inventory"></div></section><section class="panel card" data-panel="finance"><h2>Contas a receber</h2><div id="finance"></div></section></main><div class="toast" id="toast"></div><script src="/operations.js"></script><script src="/brand-shell.js"></script></body></html>
