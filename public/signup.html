<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2B7C"><title>Criar conta • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"></head><body class="landing"><main class="auth-page"><section class="auth-card"><a class="brand-word" href="/">Negoc<span>IA</span><b>Já!</b></a><span class="kicker">Comece sua jornada</span><h1>Crie sua conta</h1><p>Cadastre sua empresa, confirme o e-mail e inicie seu período de teste.</p><form id="signupForm"><label>Empresa<input name="company_name" required maxlength="120"></label><label>Seu nome<input name="name" required maxlength="120"></label><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Senha<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>Segmento<select name="segment"><option value="loja">Loja / Varejo</option><option value="delivery">Restaurante / Delivery</option><option value="comunicacao-visual">Comunicação Visual</option><option value="servicos">Prestador de Serviços</option><option value="custom">Personalizado</option></select></label><button class="btn primary large" type="submit">Criar minha conta</button></form><div id="signupStatus" class="auth-status" role="status"></div><p><a href="/login">Já tenho conta</a></p></section></main><script src="/signup.js"></script></body></html>
