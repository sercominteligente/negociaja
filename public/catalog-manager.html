<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Catálogo avançado • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;background:#f4f7fb;color:#101828;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.head a{color:#0b2b7c;font-weight:800;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #e0e7f1;border-radius:16px;padding:16px}.item{border-bottom:1px solid #edf1f6;padding:11px 0}.item:last-child{border:0}.item strong{display:block}.muted{color:#667085}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button,input{font:inherit}.btn{border:0;border-radius:9px;padding:8px 10px;background:#eaf3ff;color:#0b2b7c;font-weight:800;cursor:pointer}.btn.primary{background:#0b2b7c;color:#fff}.variant{display:flex;justify-content:space-between;gap:10px;border:1px solid #e5ebf4;border-radius:10px;padding:9px;margin-top:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.form input{border:1px solid #d5deeb;border-radius:8px;padding:8px}.form .full{grid-column:1/-1}.toast{position:fixed;right:18px;bottom:18px;background:#071a43;color:#fff;padding:10px 13px;border-radius:10px;opacity:0}.toast.show{opacity:1}@media(max-width:750px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.form .full{grid-column:auto}}</style></head><body><main class="wrap"><header class="head"><div><small class="muted">NEGOCIAJÁ • CATÁLOGO</small><h1>Produtos, serviços e variações</h1><p class="muted">Gerencie SKU, preço adicional e estoque por variação.</p></div><a href="/app">← Painel</a></header><div class="grid"><section class="card"><h2>Itens</h2><div id="items"></div></section><section class="card"><h2 id="variantTitle">Selecione um item</h2><div id="variants"><p class="muted">Escolha um produto ou serviço para gerenciar suas variações.</p></div><form id="variantForm" class="form" hidden><input name="name" required placeholder="Nome da variação"><input name="sku" placeholder="SKU"><input name="price_delta" type="number" step="0.01" placeholder="Adicional R$"><input name="stock" type="number" step="0.01" min="0" placeholder="Estoque"><label class="full"><input name="stock_control" type="checkbox"> Controlar estoque desta variação</label><button class="btn primary full" type="submit">Adicionar variação</button></form></section></div></main><div class="toast" id="toast"></div><script src="/catalog-manager.js"></script></body></html>
