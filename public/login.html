<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2B7C"><title>Entrar • NegocIAJá!</title><style>:root{--brand:#169cff;--brand2:#0b2b7c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10213f;background:#f4f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#dff6ff 0,#f4f8ff 42%,#eef3fb 100%);position:relative;overflow-x:hidden}.login-bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:.25s opacity;z-index:0}.login-bg.on{opacity:1}.login-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(6,22,57,.78),rgba(10,54,115,.45),rgba(255,255,255,.1))}.shell{position:relative;z-index:1;width:min(100%,480px)}.brand{display:flex;justify-content:center;align-items:center;min-height:70px;text-decoration:none;color:#0b2b7c;font-size:30px;font-weight:900;margin-bottom:18px}.brand span{color:var(--brand)}.brand b{color:#ffad00}.tenant-logo{max-width:220px;max-height:82px;object-fit:contain;display:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.08))}.card{background:rgba(255,255,255,.96);border:1px solid #dce6f4;border-radius:28px;padding:30px;box-shadow:0 24px 70px rgba(11,43,124,.16);backdrop-filter:blur(14px)}.kicker{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}h1{margin:0 0 8px;font-size:30px}p{margin:0 0 24px;color:#60708c;line-height:1.5}label{display:grid;gap:7px;font-weight:700;font-size:14px;margin:15px 0}input{width:100%;border:1px solid #cfdbea;border-radius:14px;padding:14px 15px;font:inherit;outline:none;background:#fbfdff}input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}button{width:100%;border:0;border-radius:15px;padding:15px 18px;font:inherit;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;margin-top:8px}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;color:#b42318;font-size:14px;font-weight:700;margin-top:12px}.hint{margin-top:18px;font-size:12px;color:#718096}.platform{display:flex;gap:8px;align-items:flex-start}.platform input{width:auto;margin-top:3px}.platform span{font-weight:600;color:#53627a;line-height:1.4}.powered{text-align:center;margin-top:14px;font-size:12px;color:#768399}@media(max-width:520px){body{padding:14px}.card{padding:24px 18px;border-radius:22px}}</style></head><body><div class="login-bg" id="loginBg"></div><main class="shell"><a class="brand" href="/"><img class="tenant-logo" id="tenantLogo" alt="Logotipo da empresa"><span id="platformWordmark">Negoc<span>IA</span><b>Já!</b></span></a><section class="card"><span class="kicker" id="loginKicker">Acesso seguro</span><h1 id="loginHeadline">Entre no painel</h1><p id="loginMessage">Use seu e-mail e senha. Informe a empresa apenas se seu e-mail estiver ligado a mais de uma conta.</p><form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="username" required placeholder="voce@empresa.com.br"></label><label>Senha<input name="password" type="password" autocomplete="current-password" minlength="10" required placeholder="••••••••••"></label><label>Empresa <small style="font-weight:500;color:#718096">(opcional)</small><input name="tenant_slug" autocomplete="organization" placeholder="Ex.: minha-loja"></label><label class="platform"><input id="platformLogin" type="checkbox"><span>Entrar como Super Admin da plataforma</span></label><button id="loginBtn" type="submit">Entrar no NegocIAJá!</button><div class="error" id="loginError" role="alert"></div></form><div class="hint">Sua sessão fica protegida em cookie seguro. Para contas comuns, a empresa é identificada automaticamente sempre que possível.</div><div class="powered" id="powered">Powered by NegocIAJá!</div></section></main><script src="/login.js"></script></body></html>
