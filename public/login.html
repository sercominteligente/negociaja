<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B2B7C">
  <title>Entrar • NegocIAJá!</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10213f;background:#f4f8ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#dff6ff 0,#f4f8ff 42%,#eef3fb 100%)}
    .shell{width:min(100%,460px)}.brand{display:block;text-align:center;text-decoration:none;color:#0b2b7c;font-size:30px;font-weight:900;margin-bottom:22px}.brand span{color:#169cff}.brand b{color:#ffad00}
    .card{background:#fff;border:1px solid #dce6f4;border-radius:28px;padding:30px;box-shadow:0 24px 70px rgba(11,43,124,.12)}
    .kicker{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#169cff;margin-bottom:8px}h1{margin:0 0 8px;font-size:30px}p{margin:0 0 24px;color:#60708c;line-height:1.5}
    label{display:grid;gap:7px;font-weight:700;font-size:14px;margin:15px 0}input{width:100%;border:1px solid #cfdbea;border-radius:14px;padding:14px 15px;font:inherit;outline:none;background:#fbfdff}input:focus{border-color:#169cff;box-shadow:0 0 0 4px rgba(22,156,255,.1)}
    button{width:100%;border:0;border-radius:15px;padding:15px 18px;font:inherit;font-weight:900;cursor:pointer;background:#0b2b7c;color:#fff;margin-top:8px}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;color:#b42318;font-size:14px;font-weight:700;margin-top:12px}.hint{margin-top:18px;font-size:12px;color:#718096}.platform{display:flex;gap:8px;align-items:flex-start}.platform input{width:auto;margin-top:3px}.platform span{font-weight:600;color:#53627a;line-height:1.4}
  </style>
</head>
<body>
  <main class="shell">
    <a class="brand" href="/">Negoc<span>IA</span><b>Já!</b></a>
    <section class="card">
      <span class="kicker">Acesso seguro</span>
      <h1>Entre no painel</h1>
      <p>Use seu e-mail, senha e o identificador da empresa. Super Admin pode entrar sem informar empresa.</p>
      <form id="loginForm">
        <label>E-mail<input name="email" type="email" autocomplete="username" required placeholder="voce@empresa.com.br"></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" minlength="10" required placeholder="••••••••••"></label>
        <label>Empresa<input name="tenant_slug" autocomplete="organization" placeholder="Ex.: demo"></label>
        <label class="platform"><input id="platformLogin" type="checkbox"><span>Entrar como Super Admin da plataforma</span></label>
        <button id="loginBtn" type="submit">Entrar no NegocIAJá!</button>
        <div class="error" id="loginError" role="alert"></div>
      </form>
      <div class="hint">A sessão é armazenada em cookie seguro HttpOnly. O navegador não recebe nem escolhe o tenant após o login.</div>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
