<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2B7C"><title>Configurar empresa • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"></head><body class="landing"><main class="auth-page"><section class="auth-card onboarding-card"><a class="brand-word" href="/">Negoc<span>IA</span><b>Já!</b></a><span class="kicker">Onboarding</span><h1>Vamos preparar sua empresa</h1><p>Defina os dados básicos para o NegocIAJá! adaptar catálogo, operação e identidade ao seu negócio.</p><form id="onboardingForm"><fieldset><legend>Empresa</legend><label>Nome público<input name="public_name" required></label><label>Razão social<input name="legal_name"></label><label>CNPJ/CPF<input name="document"></label><label>E-mail comercial<input name="email" type="email"></label><label>Telefone<input name="phone"></label></fieldset><fieldset><legend>Operação</legend><label>Segmento<select name="segment"><option value="loja">Loja / Varejo</option><option value="delivery">Restaurante / Delivery</option><option value="comunicacao-visual">Comunicação Visual</option><option value="servicos">Prestador de Serviços</option><option value="custom">Personalizado</option></select></label></fieldset><fieldset><legend>Canais</legend><label>WhatsApp<input name="whatsapp" placeholder="5585999999999"></label></fieldset><fieldset><legend>Identidade</legend><label>Cor principal<input name="primary_color" type="color" value="#169CFF"></label><label>Cor secundária<input name="secondary_color" type="color" value="#0B2B7C"></label></fieldset><button class="btn primary large" type="submit">Concluir configuração</button></form><div id="onboardingStatus" class="auth-status" role="status"></div></section></main><script src="/onboarding.js"></script></body></html>
