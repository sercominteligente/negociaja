<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2B7C"><title>Configurar empresa • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"></head><body class="landing"><main class="auth-page"><section class="auth-card onboarding-card"><a class="brand-word" href="/">Negoc<span>IA</span><b>Já!</b></a><span class="kicker">Configuração da empresa</span><h1>Sua operação, com a sua cara</h1><p>Dados, identidade, documentos e experiência de acesso ficam isolados por empresa.</p><form id="onboardingForm"><fieldset><legend>Empresa</legend><label>Nome público<input name="public_name" required></label><label>Razão social<input name="legal_name"></label><label>CNPJ/CPF<input name="document"></label><label>E-mail comercial<input name="email" type="email"></label><label>Telefone<input name="phone"></label></fieldset><fieldset><legend>Operação</legend><label>Segmento<select name="segment"><option value="loja">Loja / Varejo</option><option value="delivery">Restaurante / Delivery</option><option value="comunicacao-visual">Comunicação Visual</option><option value="servicos">Prestador de Serviços</option><option value="custom">Personalizado</option></select></label><label>WhatsApp<input name="whatsapp" placeholder="5585999999999"></label></fieldset><fieldset><legend>Identidade visual</legend><label>Cor principal<input name="primary_color" type="color" value="#169CFF"></label><label>Cor secundária<input name="secondary_color" type="color" value="#0B2B7C"></label><label>Logotipo<input name="logo" id="logoInput" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPG ou WebP • máximo 2 MB.</small></label><div id="logoPreview" hidden><img id="logoPreviewImage" alt="Logotipo atual" style="max-width:180px;max-height:90px;object-fit:contain;border:1px solid #d7dfec;border-radius:12px;padding:8px;background:#fff"><button class="touch soft-button" id="removeLogoBtn" type="button">Remover logotipo</button></div></fieldset><fieldset><legend>Documentos comerciais</legend><label>Rodapé padrão<textarea name="document_footer" rows="3" maxlength="500" placeholder="Ex.: Obrigado pela preferência • atendimento@empresa.com"></textarea></label><label>Observações padrão<textarea name="document_notes" rows="4" maxlength="1500" placeholder="Condições, validade, prazos ou informações que devem aparecer em pedidos, orçamentos e recibos."></textarea></label></fieldset><fieldset><legend>Área de acesso</legend><label>Título de boas-vindas<input name="access_headline" maxlength="140" placeholder="Ex.: Bem-vindo à Central da Minha Empresa"></label><label>Mensagem de acesso<textarea name="access_message" rows="3" maxlength="600" placeholder="Uma mensagem curta para clientes e equipe."></textarea></label><label class="check-row"><input name="access_show_brand" type="checkbox" checked> Exibir também “Powered by NegocIAJá!”</label></fieldset><button class="btn primary large" type="submit">Salvar configuração</button></form><div id="onboardingStatus" class="auth-status" role="status"></div></section></main><script src="/onboarding.js"></script></body></html>
