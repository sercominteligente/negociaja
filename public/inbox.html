<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2B7C"><title>Conversas • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><style>.inbox-shell{max-width:1400px;margin:auto;padding:92px 18px 28px}.inbox-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.inbox-grid{display:grid;grid-template-columns:340px 1fr;gap:14px;min-height:72vh}.conversation-list,.chat-panel{background:#fff;border:1px solid #e4eaf3;border-radius:20px;overflow:hidden}.conversation-list{padding:10px}.conversation-item{width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:4px}.conversation-item:hover,.conversation-item.active{background:#eef5ff}.conversation-item span,.conversation-item small{color:#667085}.chat-panel{display:grid;grid-template-rows:auto 1fr auto}.chat-head{padding:14px 16px;border-bottom:1px solid #e4eaf3;display:flex;justify-content:space-between;gap:10px;align-items:center}.chat-actions{display:flex;gap:7px;flex-wrap:wrap}.messages{padding:18px;overflow:auto;background:#f7f9fd;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(75%,680px);padding:11px 13px;border-radius:16px;background:#fff;border:1px solid #e4eaf3;display:grid;gap:5px}.bubble.outbound{margin-left:auto;background:#e9f4ff}.bubble small{color:#667085}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid #e4eaf3}.composer input{height:48px;border:1px solid #d7dfec;border-radius:14px;padding:0 13px}.empty-chat{margin:auto;color:#667085;text-align:center}.channel{font-size:11px;font-weight:900;color:#169cff;text-transform:uppercase}.mode{font-size:11px;border-radius:99px;padding:5px 8px;background:#eef5ff;color:#0b2b7c}@media(max-width:820px){.inbox-grid{grid-template-columns:1fr}.conversation-list{max-height:280px;overflow:auto}.chat-panel{min-height:60vh}.inbox-head{align-items:flex-start;flex-direction:column}.bubble{max-width:90%}}</style></head><body class="dashboard"><header class="dash-top"><a class="brand-word" href="/app">Negoc<span>IA</span><b>Já!</b></a><div class="top-actions"><a class="btn soft" href="/acoes-ia">Ações da IA</a><a class="btn soft" href="/app">← Painel</a><a class="btn soft" href="/onboarding">Configurações</a></div></header><main class="inbox-shell"><div class="inbox-head"><div><span class="kicker">Conversation Hub</span><h1>Conversas</h1><p>IA e equipe no mesmo histórico, com takeover controlado.</p></div><button class="btn primary" id="refreshInbox">↻ Atualizar</button></div><section class="inbox-grid"><aside class="conversation-list" id="conversationList"><div class="empty">Carregando conversas…</div></aside><article class="chat-panel"><header class="chat-head"><div><strong id="chatName">Selecione uma conversa</strong><div><span class="channel" id="chatChannel"></span> <span class="mode" id="chatMode"></span></div></div><div class="chat-actions"><button class="touch soft-button" id="aiRespondBtn" hidden>✨ Responder com IA</button><button class="touch soft-button" id="takeoverBtn" hidden>Assumir</button><button class="touch soft-button" id="releaseBtn" hidden>Devolver à IA</button><button class="touch soft-button" id="closeBtn" hidden>Encerrar</button></div></header><div class="messages" id="messages"><div class="empty-chat">Escolha uma conversa à esquerda.</div></div><form class="composer" id="composer"><input id="messageInput" placeholder="Responder ao cliente…" autocomplete="off" disabled><button class="btn primary" type="submit" disabled id="sendBtn">Enviar</button></form></article></section></main><script src="/inbox.js"></script></body></html>
