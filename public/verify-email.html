<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Confirmar e-mail • NegocIAJá!</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#071a43;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe8f6;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(11,43,124,.12);text-align:center}.brand{font-size:30px;font-weight:950;color:#0b2b7c}.brand span{color:#169cff}.brand b{color:#ff9800}h1{font-size:28px;margin:24px 0 9px}p{color:#66758e;line-height:1.6}.status{margin:18px 0;padding:14px;border-radius:12px;background:#eef7ff;color:#0b2b7c}.status.error{background:#fff0f0;color:#972626}a{display:inline-block;margin-top:12px;padding:12px 17px;border-radius:11px;background:#0d61df;color:#fff;text-decoration:none;font-weight:850}</style></head><body><main class="card"><div class="brand">Negoc<span>IA</span><b>Já!</b></div><h1>Confirmação de adesão</h1><p>Estamos validando seu e-mail e liberando o ambiente da empresa.</p><div id="status" class="status">Validando…</div><a id="continue" href="/app" hidden>Continuar para o NegocIAJá!</a></main><script>const status=document.querySelector('#status'),button=document.querySelector('#continue'),token=new URL(location.href).searchParams.get('token')||'';(async()=>{try{if(!token)throw new Error('Token de confirmação ausente.');const r=await fetch('/api/signup/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'Não foi possível confirmar.');status.textContent=`E-mail confirmado. Empresa liberada por ${p.data?.trial_days||7} dias para o onboarding.`;button.hidden=false}catch(e){status.classList.add('error');status.textContent=e instanceof Error?e.message:String(e)}})();</script></body></html>
