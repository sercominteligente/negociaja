<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Laboratório HML • NegocIAJá!</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;background:#f4f7fb;color:#071a43;font-family:Inter,system-ui,Arial,sans-serif}.top{display:flex;justify-content:space-between;padding:16px 24px;background:#fff;border-bottom:1px solid #dde6f2}.top a{color:#0b2b7c;font-weight:800;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;margin-top:18px}.card{background:#fff;border:1px solid #dfe7f3;border-radius:18px;padding:18px}.form{display:grid;gap:10px}.form label{display:grid;gap:5px;font-size:13px;font-weight:800}.form input,.form textarea,.form select{border:1px solid #cfd9e7;border-radius:10px;padding:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#1269e8;color:#fff;font-weight:800;cursor:pointer}.trace{display:grid;gap:8px;max-height:560px;overflow:auto}.row{padding:10px;border:1px solid #e4eaf3;border-radius:10px}.row strong{display:block}.row small{color:#667085}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:1px solid #d9e2ef;background:#fff;padding:7px 10px;border-radius:9px;font-weight:700}.tabs button.active{background:#0b2b7c;color:#fff}.toast{position:fixed;right:20px;bottom:20px;background:#071a43;color:#fff;padding:12px 16px;border-radius:11px;opacity:0}.toast.show{opacity:1}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}}</style></head><body><header class="top"><a href="/app">← Painel</a><div><a href="/team.html">Equipe & Integrações</a> · <a href="/super-admin">Super Admin</a></div></header><main class="wrap"><div class="hero"><div><span style="font-weight:900;color:#169cff">HOMOLOGAÇÃO</span><h1>Laboratório ponta a ponta</h1><p>Simule uma entrada de WhatsApp e acompanhe o rastro persistido no NegocIAJá.</p></div><button id="refresh" class="btn">Atualizar rastro</button></div><div class="grid"><section class="card"><h2>Simular mensagem</h2><form id="simForm" class="form"><label>Telefone<input name="phone" value="5585999999999" required></label><label>Tipo<select name="content_type"><option value="text">Texto</option><option value="audio">Áudio transcrito</option><option value="image">Imagem com legenda</option></select></label><label>Conteúdo<textarea name="body" rows="6" required>Olá, quero saber mais sobre um produto.</textarea></label><button class="btn" type="submit">Enviar ao gateway real</button></form><div id="result" style="margin-top:14px;color:#667085"></div></section><section class="card"><div class="tabs"><button data-view="events" class="active">Eventos</button><button data-view="messages">Mensagens</button><button data-view="outbox">Outbox</button><button data-view="conversations">Conversas</button></div><div id="trace" class="trace"></div></section></div></main><div id="toast" class="toast"></div><script src="/hml-lab.js"></script></body></html>
