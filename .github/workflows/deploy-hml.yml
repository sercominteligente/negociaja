name: Deploy HML

on:
  push:
    branches:
      - hml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: negociaja-hml-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: d750711fce41908fe354fa2e7284d6be
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy-hml:
    name: Deploy isolated HML
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout HML
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HML_PASSWORD: ${{ secrets.HML_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$HML_PASSWORD" || { echo "Missing repository secret: HML_PASSWORD"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate HML
        run: npm run check:hml

      - name: Deploy HML Worker and provision isolated bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:hml

      - name: Configure HML Basic Auth secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HML_PASSWORD: ${{ secrets.HML_PASSWORD }}
        run: printf '%s' "$HML_PASSWORD" | npx wrangler secret put HML_PASSWORD --env hml

      - name: List HML migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:hml:list

      - name: Apply HML migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:hml:apply

      - name: Confirm HML deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deployments list --env hml
