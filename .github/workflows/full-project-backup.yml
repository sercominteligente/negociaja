name: Full Project Backup

on:
  push:
    branches:
      - backup/2026-08-20-full-project
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build portable backup
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          OUT="$RUNNER_TEMP/negociaja-backup"
          mkdir -p "$OUT/PROJECT" "$OUT/METADATA"

          rsync -a --exclude='.git' --exclude='NegocIAJa-FULL-BACKUP-2026-08-20.zip' ./ "$OUT/PROJECT/"

          git log --all --decorate --graph --date=iso --pretty=format:'%h %ad %d %s [%an]' > "$OUT/METADATA/GIT-HISTORY.txt"
          git status --short --branch > "$OUT/METADATA/GIT-STATUS.txt"
          git branch -a -vv > "$OUT/METADATA/GIT-BRANCHES.txt"
          git rev-parse HEAD > "$OUT/METADATA/BACKUP-COMMIT.txt"
          git remote -v > "$OUT/METADATA/GIT-REMOTES.txt"

          git bundle create "$OUT/METADATA/negociaja-history.bundle" --all

          cat > "$OUT/METADATA/BACKUP-INFO.txt" <<EOF
          NegocIAJá! — Backup Mestre
          Generated by GitHub Actions
          Source branch: backup/2026-08-20-full-project
          Source baseline: hml
          Backup date: 2026-08-20
          This package contains a complete source snapshot, continuity documentation,
          Git history text and a portable Git bundle. No external service secrets are intentionally included.
          EOF

          cd "$OUT"
          zip -qr "$ROOT/NegocIAJa-FULL-BACKUP-2026-08-20.zip" .

      - name: Upload backup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NegocIAJa-FULL-BACKUP-2026-08-20
          path: NegocIAJa-FULL-BACKUP-2026-08-20.zip
          if-no-files-found: error
          retention-days: 30
