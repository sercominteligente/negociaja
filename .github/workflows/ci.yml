name: NegocIAJa CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: SER copyright signature check
        run: node scripts/check-copyright.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: JavaScript syntax check
        run: find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Apply all D1 migrations locally
        run: npm run db:local
      - name: Worker deployment dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
